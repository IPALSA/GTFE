<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIF 용량 줄이기 · 크롭</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#dcdcd5;--ac:#3b5bdb;--acfg:#fff;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#8da2ff;--acfg:#10131f;--ok:#69db7c;--bad:#ff8787}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#8da2ff;--acfg:#10131f;--ok:#69db7c;--bad:#ff8787}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

<body>
<main data-tab="edit">
<h1>GIF 용량 줄이기 · 크롭</h1>
<p class="s">60KB 이하 · 최대 60프레임 · 해상도는 최대한 유지하고 색상·프레임 차이부터 최적화합니다. 파일은 서버로 전송되지 않고 브라우저에서만 처리됩니다.</p>

<nav class="tabs" id="tabs" hidden><button type="button" class="tb on" data-t="edit">크롭·압축</button><button type="button" class="tb" data-t="fx">효과</button></nav>

  <div id="panes"></div>

  <p class="info">효과는 항상 원본 GIF 기준으로 적용됩니다(겹쳐서 쌓이지 않음). 적용 후 크롭·압축 탭에서 용량을 맞추세요. 디더링·노이즈·오일페인트 같은 효과는 용량이 크게 늘 수 있습니다.</p>

  </div>

<script>
/* ===== 외부 라이브러리 없는 GIF 디코더 / 양자화 / 인코더 ===== */
function lzwDecode(mc,data,npix){
  const clear=1<<mc,eoi=clear+1;let size=mc+1,mask=(1<<size)-1,next=eoi+1;
  const prefix=new Uint16Array(4096),suffix=new Uint8Array(4096),stack=new Uint8Array(4097);
  const out=new Uint8Array(npix);let op=0,bits=0,acc=0,pos=0,old=-1,first=0;
  for(let i=0;i<clear;i++)suffix[i]=i;
  while(op<npix){
    while(bits<size&&pos<data.length){acc|=data[pos++]<<bits;bits+=8}
    if(bits<size)break;
    let code=acc&mask;acc>>=size;bits-=size;
    if(code===clear){size=mc+1;mask=(1<<size)-1;next=eoi+1;old=-1;continue}
    if(code===eoi)break;
    if(old===-1){out[op++]=suffix[code];old=code;first=code;continue}
    const inc=code;let sp=0;
    if(code>=next){stack[sp++]=first;code=old}
    while(code>=clear){stack[sp++]=suffix[code];code=prefix[code]}
    first=suffix[code];stack[sp++]=first;
    if(next<4096){prefix[next]=old;suffix[next]=first;next++;if((next&mask)===0&&next<4096){size++;mask=(1<<size)-1}}
    old=inc;
    while(sp>0&&op<npix)out[op++]=stack[--sp];
  }
  return out;
}
function decodeGIF(b){
  if(b[0]!==71||b[1]!==73||b[2]!==70)throw new Error('GIF 파일이 아닙니다');
  let p=6;const W=b[p]|b[p+1]<<8,H=b[p+2]|b[p+3]<<8,fl=b[p+4];p+=7;
  let gct=null;if(fl&128){const n=3<<((fl&7)+1);gct=b.subarray(p,p+n);p+=n}
  const frames=[];let g={delay:100,disp:0,ti:-1};
  while(p<b.length){
    const t=b[p++];
    if(t===0x3B)break;
    if(t===0x21){
      const l=b[p++];
      if(l===0xF9){const f=b[p+1];g={disp:(f>>2)&7,ti:(f&1)?b[p+4]:-1,delay:(b[p+2]|b[p+3]<<8)*10}}
      while(p<b.length&&b[p]){p+=b[p]+1}p++;continue;
    }
    if(t!==0x2C)continue;
    const L=b[p]|b[p+1]<<8,T=b[p+2]|b[p+3]<<8,w=b[p+4]|b[p+5]<<8,h=b[p+6]|b[p+7]<<8,f=b[p+8];p+=9;
    let ct=gct;if(f&128){const n=3<<((f&7)+1);ct=b.subarray(p,p+n);p+=n}
    const mc=b[p++],chunks=[];let tot=0;
    while(p<b.length&&b[p]){const n=b[p];chunks.push(b.subarray(p+1,p+1+n));tot+=n;p+=n+1}p++;
    const d=new Uint8Array(tot);let o=0;for(const c of chunks){d.set(c,o);o+=c.length}
    let ix=lzwDecode(mc,d,w*h);
    if(f&64){const o2=new Uint8Array(w*h);let r=0;for(const[s,st]of[[0,8],[4,8],[2,4],[1,2]])for(let y=s;y<h;y+=st,r++)o2.set(ix.subarray(r*w,r*w+w),y*w);ix=o2}
    const rgba=new Uint8ClampedArray(w*h*4);
    for(let i=0;i<w*h;i++){const c=ix[i];if(c===g.ti||!ct||c*3+2>=ct.length)continue;rgba[i*4]=ct[c*3];rgba[i*4+1]=ct[c*3+1];rgba[i*4+2]=ct[c*3+2];rgba[i*4+3]=255}
    frames.push({left:L,top:T,width:w,height:h,delay:g.delay,disp:g.disp,rgba});
    g={delay:100,disp:0,ti:-1};
  }
  if(!frames.length)throw new Error('프레임이 없습니다');
  return{width:W,height:H,frames};
}
/* 메디안 컷 양자화 (RGB565 히스토그램 기반) */
function quantize(px,K){
  const hist=new Uint32Array(65536);
  for(let i=0;i<px.length;i+=4)hist[(px[i]>>3)<<11|(px[i+1]>>2)<<5|px[i+2]>>3]++;
  const ent=[];for(let k=0;k<65536;k++)if(hist[k])ent.push(k);
  const ch=(k,a)=>a===0?((k>>11)<<3)|4:a===1?(((k>>5)&63)<<2)|2:((k&31)<<3)|4;
  let boxes=[ent];
  while(boxes.length<K){
    let bi=-1,bs=0,ba=0;
    boxes.forEach((b,i)=>{
      if(b.length<2)return;let pop=0;for(const k of b)pop+=hist[k];
      for(let a=0;a<3;a++){let mn=255,mx=0;for(const k of b){const v=ch(k,a);if(v<mn)mn=v;if(v>mx)mx=v}
        const s=(mx-mn)*Math.sqrt(pop);if(s>bs){bs=s;bi=i;ba=a}}
    });
    if(bi<0)break;
    const b=boxes[bi].slice().sort((x,y)=>ch(x,ba)-ch(y,ba));
    let pop=0;for(const k of b)pop+=hist[k];
    let cum=0,cut=1;for(let i=0;i<b.length-1;i++){cum+=hist[b[i]];cut=i+1;if(cum>=pop/2)break}
    boxes.splice(bi,1,b.slice(0,cut),b.slice(cut));
  }
  return boxes.map(b=>{let r=0,g=0,bl=0,n=0;for(const k of b){const c=hist[k];r+=ch(k,0)*c;g+=ch(k,1)*c;bl+=ch(k,2)*c;n+=c}
    return[Math.round(r/n),Math.round(g/n),Math.round(bl/n)]});
}
function applyPalette(px,pal){
  const n=px.length>>2,out=new Uint8Array(n),cache=new Int16Array(65536).fill(-1);
  for(let i=0;i<n;i++){
    const j=i*4,k=(px[j]>>3)<<11|(px[j+1]>>2)<<5|px[j+2]>>3;let c=cache[k];
    if(c<0){const r=px[j],g=px[j+1],b=px[j+2];let best=1e9;c=0;
      for(let q=0;q<pal.length;q++){const d=(pal[q][0]-r)**2+(pal[q][1]-g)**2+(pal[q][2]-b)**2;if(d<best){best=d;c=q}}cache[k]=c}
    out[i]=c;
  }
  return out;
}
const _lzwTab=new Uint16Array(1<<20);
function lzwEncode(idx,mc,out){
  const clear=1<<mc,eoi=clear+1,tab=_lzwTab;tab.fill(0);
  let size=mc+1,next=eoi+1,acc=0,nb=0;const blk=[];
  const emit=c=>{acc|=c<<nb;nb+=size;while(nb>=8){blk.push(acc&255);acc>>=8;nb-=8}};
  out.push(mc);emit(clear);let pre=idx[0];
  for(let i=1;i<idx.length;i++){
    const c=idx[i],key=pre<<8|c,v=tab[key];
    if(v){pre=v;continue}
    emit(pre);
    if(next===4096){emit(clear);tab.fill(0);size=mc+1;next=eoi+1}
    else{if(next>=(1<<size))size++;tab[key]=next++}
    pre=c;
  }
  emit(pre);emit(eoi);if(nb>0)blk.push(acc&255);
  for(let i=0;i<blk.length;i+=255){const n=Math.min(255,blk.length-i);out.push(n);for(let j=0;j<n;j++)out.push(blk[i+j])}
  out.push(0);
}
function encodeGIF(w,h,pal,frames,loop){
  const out=[],u16=v=>out.push(v&255,(v>>8)&255);
  let bits=1;while((1<<bits)<pal.length)bits++;
  out.push(71,73,70,56,57,97);u16(w);u16(h);out.push(0x80|0x70|(bits-1),0,0);
  for(let i=0;i<(1<<bits);i++){const c=pal[i]||[0,0,0];out.push(c[0],c[1],c[2])}
  if(loop!==1){const lc=loop>1?loop-1:0;out.push(0x21,0xFF,11,78,69,84,83,67,65,80,69,50,46,48,3,1,lc&255,lc>>8,0)}
  for(const f of frames){
    out.push(0x21,0xF9,4,(f.dispose<<2)|1);u16(Math.round(f.delay/10));out.push(f.t,0);
    out.push(0x2C);u16(f.x);u16(f.y);u16(f.w);u16(f.h);out.push(0);
    lzwEncode(f.idx,Math.max(2,bits),out);
  }
  out.push(0x3B);return Uint8Array.from(out);
}
/* RGBA 프레임들 → 최적화된 GIF (전역 팔레트 + 프레임 간 차이 + 투명 유지) */
async function buildGif(data,w,h,dl,cfg){
  const pick=[],np=Math.min(6,data.length);
  for(let i=0;i<np;i++)pick.push(data[Math.floor(i*data.length/np)]);
  const sample=new Uint8Array(pick.reduce((a,d)=>a+d.length,0));let o=0;
  for(const d of pick)for(let i=0;i<d.length;i+=4)if(d[i+3]>=128){sample[o++]=d[i];sample[o++]=d[i+1];sample[o++]=d[i+2];sample[o++]=255}
  const pal=o?quantize(sample.subarray(0,o),cfg.colors-1):[[0,0,0]],T=pal.length,full=pal.concat([[0,0,0]]);
  const N=data.length,n=w*h,outs=[];let prev=null,hasT=false;
  for(let i=0;i<N;i++){
    const d=data[i],idx=applyPalette(d,pal);
    for(let p=0;p<n;p++)if(d[p*4+3]<128){idx[p]=T;hasT=true}
    if(!prev){prev=Uint8Array.from(idx);outs.push({o:idx,c:false});continue}
    let clear=false;
    for(let p=0;p<n;p++)if(idx[p]===T&&prev[p]!==T){clear=true;break}
    if(clear){prev=Uint8Array.from(idx);outs.push({o:idx,c:true});continue}
    const out=new Uint8Array(n);
    for(let p=0;p<n;p++){
      const a=idx[p],b=prev[p];
      if(a===b){out[p]=T;continue}
      if(b!==T){const A=full[a],B=full[b];if(Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1])+Math.abs(A[2]-B[2])<=cfg.tol){out[p]=T;continue}}
      out[p]=a;prev[p]=a;
    }
    outs.push({o:out,c:false});
    if(i%8===7)await tick();
  }
  const anyClear=outs.some(x=>x.c),fr=[];
  for(let i=0;i<N;i++){
    let X=0,Y=0,fw=w,fh=h,px=outs[i].o;
    if(!anyClear&&i>0){
      let x0=w,y0=h,x1=-1,y1=-1;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[y*w+x]!==T){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      if(x1<0){X=0;Y=0;fw=1;fh=1;px=Uint8Array.of(T)}
      else{X=x0;Y=y0;fw=x1-x0+1;fh=y1-y0+1;const s=new Uint8Array(fw*fh);for(let y=0;y<fh;y++)s.set(px.subarray((y+Y)*w+X,(y+Y)*w+X+fw),y*fw);px=s}
    }
    fr.push({x:X,y:Y,w:fw,h:fh,idx:px,delay:Math.max(20,dl[i]),dispose:(i+1<N&&outs[i+1].c)?2:1,t:T});
  }
  return{bytes:encodeGIF(w,h,full,fr,cfg.loop||0),w,h,n:N,cfg,hasT};
}
</script>
<script>
const $=s=>document.querySelector(s), MAXF=60;
const cv=$('#cv'), cx=cv.getContext('2d');
let frames=[], delays=[], W=0, H=0, k=1, ratio=1, crop={x:0,y:0,w:1,h:1}, drag=null, url=null, pv=null, bgKey=null, picking=false, srcFrames=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tick=()=>new Promise(r=>setTimeout(r));

/* ---------- 파일 로드 ---------- */
const drop=$('#drop'), file=$('#file');
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};
file.onchange=()=>file.files[0]&&load(file.files[0]);

async function load(f){
  drop.firstChild.nodeValue='불러오는 중… '+f.name;
  try{
    const gif=decodeGIF(new Uint8Array(await f.arrayBuffer())),fr=gif.frames.map(x=>({patch:x.rgba,dims:{left:x.left,top:x.top,width:x.width,height:x.height},disposalType:x.disp,delay:x.delay}));
    W=gif.width;H=gif.height;
    const n=fr.length, keepN=Math.min(n,MAXF);
    const keep=Array.from({length:keepN},(_,i)=>Math.floor(i*n/keepN));
    const km=new Map(keep.map((v,j)=>[v,j]));
    delays=keep.map((s,j)=>{let d=0;const e=j+1<keepN?keep[j+1]:n;for(let i=s;i<e;i++){let x=fr[i].delay||0;d+=x<=10?100:x}return d});
    frames=[];
    const mc=document.createElement('canvas');mc.width=W;mc.height=H;const m=mc.getContext('2d',{willReadFrequently:true});
    const tc=document.createElement('canvas'),t=tc.getContext('2d');
    for(let i=0;i<n;i++){
      const p=fr[i],d=p.dims;let save=null;
      if(p.disposalType===3)save=m.getImageData(0,0,W,H);

  if(G.vignette||G.lomo||G.toaster){
    const cx=W/2,cy=H/2,md=Math.hypot(cx,cy);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const f=1-.7*Math.pow(Math.hypot(x-cx,y-cy)/md,2.2),i=(y*W+x)*4;d[i]*=f;d[i+1]*=f;d[i+2]*=f}
  }
  if(G.ord){const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i+3]<128)continue;const o=(B[(y&3)*4+(x&3)]/16-.5)*85;
      for(let k=0;k<3;k++)d[i+k]=Math.round(Math.max(0,Math.min(255,d[i+k]+o))/255*3)/3*255}}
  if(G.err){const f=Float32Array.from(d),add=(j,k,v)=>{if(j>=0&&j<f.length)f[j+k]+=v};
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(d[i+3]<128)continue;
      for(let k=0;k<3;k++){const old=Math.max(0,Math.min(255,f[i+k])),nw=Math.round(old/255*3)/3*255,e=old-nw;d[i+k]=nw;
        if(x<W-1)add(i+4,k,e*7/16);if(y<H-1){if(x>0)add(i+W*4-4,k,e*3/16);add(i+W*4,k,e*5/16);if(x<W-1)add(i+W*4+4,k,e/16)}}}}
  if(G.fuzzy){const F=Math.max(4,Math.round(Math.min(W,H)*.1));
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const e=Math.min(x,y,W-1-x,H-1-y);
      if(e<F&&((Math.imul(x,73856093)^Math.imul(y,19349663))>>>0)%1000/1000>e/F)d[(y*W+x)*4+3]=0}}
  x0.putImageData(im,0,0);
  if(G.round){x0.globalCompositeOperation='destination-in';x0.beginPath();rrPath(x0,0,0,W,H,Math.min(W,H)*G.roundR/100);x0.fill();x0.globalCompositeOperation='source-over'}
  const pad=(l,t,r,b,col,rad)=>{const n=mk(out.width+l+r,out.height+t+b),q=n.getContext('2d'),w=out.width,h=out.height;
    q.beginPath();q.rect(0,0,n.width,n.height);rrPath(q,l,t,w,h,rad);q.fillStyle=col;q.fill('evenodd');
    q.save();q.beginPath();rrPath(q,l,t,w,h,rad);q.clip();q.drawImage(out,l,t);q.restore();out=n};
  const mn=Math.min(W,H);
  if(G.border)pad(G.borderW,G.borderW,G.borderW,G.borderW,G.borderC,0);
  if(G.camera){const b=Math.round(mn*.07);pad(b,b,b,b,'#000000',b*1.5)}
  if(G.polaroid){const s=Math.round(mn*.05);pad(s,s,s,Math.round(mn*.18),'#ffffff',0)}
  return out;
}
function setFrames(fr,dl){
  frames=fr;delays=dl;W=fr[0].width;H=fr[0].height;
  k=Math.min(1,Math.min(600,document.querySelector('main').clientWidth-30)/W);
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);k=cv.width/W;pv=null;
  $('#meta').dataset.base=`${W}×${H}px · ${fr.length}프레임`;fit(ratio);updPv();
}
function fxPrev(){
  if(!origFrames.length||$('main').dataset.tab!=='fx')return;
  const o=applyFx(origFrames[0]),s=Math.min(1,380/o.width),f=$('#fcv');
  f.width=Math.max(1,Math.round(o.width*s));f.height=Math.max(1,Math.round(o.height*s));
  f.getContext('2d').drawImage(o,0,0,f.width,f.height);
  $('#fxinfo').textContent=`미리보기(첫 프레임) · 결과 ${o.width}×${o.height}px · 아직 적용 전입니다. 아래 [효과 적용]을 누르세요.`;
}
let fq=false;function fxDirty(){if(fq)return;fq=true;requestAnimationFrame(()=>{fq=false;fxPrev()})}
function setTab(t){$('main').dataset.tab=t;document.querySelectorAll('#tabs .tb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='fx')fxPrev()}
document.querySelectorAll('#tabs .tb').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#fxApply').onclick=async()=>{
  const b=$('#fxApply'),G=fxState(),n=origFrames.length;b.disabled=true;
  try{
    const out=[];
    for(let i=0;i<n;i++){b.textContent=`적용 중… ${i+1}/${n}`;out.push(applyFx(origFrames[i],G));if(i%2)await tick()}
    const dl=origDelays.slice();if(G.rev){out.reverse();dl.reverse()}
    setFrames(out,dl);setTab('edit');$('#meta').dataset.base+=' · 효과 적용됨';draw();
  }catch(e){console.error(e);alert('효과 적용 중 오류가 발생했습니다.')}
  b.disabled=false;b.textContent='효과 적용';
};
$('#fxReset').onclick=()=>{fxResetUI();if(origFrames.length){setFrames(origFrames,origDelays);fxPrev()}};
buildFx();

/* ---------- 인코딩 ---------- */
async function encode(cfg){
  const cw=Math.round(crop.w),ch=Math.round(crop.h),cx0=Math.round(crop.x),cy0=Math.round(crop.y);
  const bs=baseScale(),w=Math.max(8,Math.round(cw*cfg.s*bs)),h=Math.max(8,Math.round(ch*cfg.s*bs));
  const fl=[],dl=[];
  for(let i=0;i<frames.length;i+=cfg.step){fl.push((srcFrames||frames)[i]);let d=0;for(let j=i;j<Math.min(i+cfg.step,frames.length);j++)d+=delays[j];dl.push(d)}
  const rc=document.createElement('canvas');rc.width=w;rc.height=h;
  const r=rc.getContext('2d',{willReadFrequently:true});r.imageSmoothingQuality='high';
  const data=[];
  for(const f of fl){r.clearRect(0,0,w,h);r.drawImage(f,cx0,cy0,cw,ch,0,0,w,h);data.push(r.getImageData(0,0,w,h).data);await tick()}
  const GG=fxState();cfg.loop=GG.loopOn?Math.max(1,GG.loopN|0):0;const r2=await buildGif(data,w,h,dl,cfg);r2.cw=cw;return r2;
}

$('#go').onclick=async()=>{
  const btn=$('#go'),L=(+$('#kb').value||60)*1000,minS=clamp(+$('#minS').value||50,20,100)/100;
  const LV=[[0,256],[6,256],[12,256],[20,192],[30,128],[45,96],[60,64]];
  let SC=[1,.92,.85,.78,.72,.66,.6,.55,.5,.45,.4,.35,.3,.25].filter(s=>s>=minS-1e-6);if(!SC.length)SC=[1];
  if($('#lock').checked)SC=[1];
  const cfgs=[];for(const step of[1,2])for(const s of SC)for(const[tol,colors]of LV)cfgs.push({s,tol,colors,step});
  const cache={};let tries=0;
  const tryI=async i=>{if(!cache[i]){tries++;btn.textContent=`압축 중… (${tries}번째 시도)`;cache[i]=await encode(cfgs[i])}return cache[i]};
  btn.disabled=true;
  try{
    srcFrames=null;
    if($('#bg').checked&&bgKey){srcFrames=[];for(let i=0;i<frames.length;i++){btn.textContent=`배경 제거 중… (${i+1}/${frames.length})`;srcFrames.push(proc(frames[i]));await tick()}}
    let res=await tryI(0),fail=false;
    if(res.bytes.length>L){
      const last=await tryI(cfgs.length-1);
      if(last.bytes.length>L){res=last;fail=true}
      else{let lo=0,hi=cfgs.length-1;while(hi-lo>1){const m=(lo+hi)>>1;(await tryI(m)).bytes.length<=L?hi=m:lo=m}res=await tryI(hi)}
    }
    if(url)URL.revokeObjectURL(url);
    url=URL.createObjectURL(new Blob([res.bytes],{type:'image/gif'}));
    $('#out').src=url;$('#dl').href=url;$('#res').hidden=false;
    const kb=(res.bytes.length/1000).toFixed(1),c=res.cfg;
    $('#stat').innerHTML=`<span class="${fail?'bad':'ok'}">${kb}KB ${fail?'(목표 초과)':'✓'}</span> · ${res.w}×${res.h}px (크롭 대비 ${Math.round(res.w/res.cw*100)}%) · ${res.n}프레임 · 색상 ${c.colors} · 프레임 차이 허용치 ${c.tol}`+(c.step>1?' · 프레임 절반 감소':'')+(res.hasT?' · 투명 배경 유지':'')+(fail?'<br>최소 크기 비율을 낮추거나 크롭 영역을 줄여 보세요.':'');
    $('#res').scrollIntoView({behavior:'smooth'});
  }catch(err){console.error(err);alert('압축 중 오류가 발생했습니다.')}
  btn.disabled=false;btn.textContent='크롭 & 압축하기';
};
</script>
